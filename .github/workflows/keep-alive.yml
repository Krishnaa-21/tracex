name: Keep TraceX Backend Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping TraceX Backend
        run: |
          URL="https://tracex-backend-3.onrender.com"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          
          echo "Backend returned HTTP status: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "Backend is warm."
          else
            echo "Backend returned an unexpected status."
            exit 1
          fi